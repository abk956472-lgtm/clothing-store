<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>إمبراطور الظلام والنور</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial,"Tahoma",sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

#cinema{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
}

.bar{
    position:absolute;
    left:0;
    width:100%;
    height:8vh;
    background:#000;
}

.bar.top{
    top:0;
}

.bar.bottom{
    bottom:0;
}

#title{
    position:absolute;
    top:14%;
    width:100%;
    text-align:center;
    color:white;
    opacity:0;
    transform:scale(.8);
    transition:opacity 1s,transform 1s;
    text-shadow:
        0 0 10px #00e5ff,
        0 0 30px #ff0055;
}

#title h1{
    font-size:clamp(25px,6vw,70px);
}

#title p{
    margin-top:12px;
    font-size:clamp(12px,2vw,22px);
}

#subtitle{
    position:absolute;
    bottom:13%;
    width:100%;
    text-align:center;
    color:white;
    font-size:clamp(13px,2.5vw,28px);
    opacity:0;
    text-shadow:0 0 15px #fff;
}

#flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:0;
}

#scene{
    position:absolute;
    top:15px;
    left:20px;
    color:#aaa;
    font-size:12px;
    opacity:.7;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="cinema">
    <div class="bar top"></div>
    <div class="bar bottom"></div>

    <div id="title">
        <h1>إمبراطور الظلام والنور</h1>
        <p>أيومي أشيا ضد قائد الشياطين</p>
    </div>

    <div id="subtitle"></div>
    <div id="flash"></div>
    <div id="scene">SCENE 01</div>
</div>

<script>
/* =========================================================
   إمبراطور الظلام والنور
   Animated Anime Cinematic
   يعمل تلقائياً بدون أي تحكم
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W,H,dpr;
let frame=0;
let time=0;

const FPS=60;

/* -----------------------------
   الشخصيات
----------------------------- */

const ayumi={
    x:0,
    y:0,
    scale:1,
    angle:0,
    aura:"#00e5ff",
    light:"#ffe600",
    hair:"#101b38",
    attacking:false
};

const demon={
    x:0,
    y:0,
    scale:1,
    angle:0,
    aura:"#ff0055",
    light:"#a000ff",
    hair:"#16000b",
    attacking:false
};

/* -----------------------------
   الجزيئات
----------------------------- */

const particles=[];

class Particle{

    constructor(x,y,color,options={}){

        const angle=
            options.angle ??
            Math.random()*Math.PI*2;

        const speed=
            options.speed ??
            Math.random()*6+1;

        this.x=x;
        this.y=y;

        this.vx=Math.cos(angle)*speed;
        this.vy=Math.sin(angle)*speed;

        this.color=color;

        this.size=
            options.size ??
            Math.random()*4+1;

        this.life=
            options.life ??
            Math.random()*50+20;

        this.maxLife=this.life;

        this.gravity=
            options.gravity ??
            .05;
    }

    update(){

        this.x+=this.vx;
        this.y+=this.vy;

        this.vy+=this.gravity;

        this.vx*=.985;
        this.vy*=.985;

        this.life--;

        this.size*=.985;
    }

    draw(){

        const alpha=
            Math.max(0,this.life/this.maxLife);

        ctx.save();

        ctx.globalAlpha=alpha;

        ctx.fillStyle=this.color;

        ctx.shadowColor=this.color;
        ctx.shadowBlur=15;

        ctx.beginPath();
        ctx.arc(
            this.x,
            this.y,
            Math.max(.1,this.size),
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }
}

/* -----------------------------
   إنشاء الانفجار
----------------------------- */

function explosion(
    x,
    y,
    color1,
    color2,
    amount=80,
    power=10
){

    for(let i=0;i<amount;i++){

        particles.push(
            new Particle(
                x,
                y,
                Math.random()>.5?
                color1:
                color2,
                {
                    speed:
                        Math.random()*power+2,

                    size:
                        Math.random()*6+1,

                    life:
                        Math.random()*40+30
                }
            )
        );
    }
}

/* -----------------------------
   شظايا طاقة
----------------------------- */

function energyParticles(char,color){

    for(let i=0;i<4;i++){

        particles.push(
            new Particle(
                char.x+
                (Math.random()-.5)*35,

                char.y-
                50+
                (Math.random()-.5)*50,

                color,
                {
                    speed:Math.random()*2+1,
                    size:Math.random()*3+1,
                    life:30
                }
            )
        );
    }
}

/* -----------------------------
   حجم الشاشة
----------------------------- */

function resize(){

    dpr=
        Math.min(window.devicePixelRatio||1,2);

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();

/* =========================================================
   الخلفية
========================================================= */

function background(){

    const gradient=
        ctx.createLinearGradient(
            0,0,
            0,H
        );

    gradient.addColorStop(
        0,
        "#02020b"
    );

    gradient.addColorStop(
        .45,
        "#090719"
    );

    gradient.addColorStop(
        1,
        "#020107"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,W,H
    );

    /* القمر */

    ctx.save();

    ctx.globalAlpha=.22;

    ctx.shadowColor="#ffffff";
    ctx.shadowBlur=70;

    ctx.fillStyle="#dcecff";

    ctx.beginPath();

    ctx.arc(
        W*.5,
        H*.23,
        Math.min(W,H)*.09,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

    /* النجوم */

    for(let i=0;i<100;i++){

        const x=
            (i*173)%W;

        const y=
            (i*83)%(H*.62);

        const a=
            .25+
            Math.sin(
                frame*.025+i
            )*.15;

        ctx.fillStyle=
            `rgba(255,255,255,${a})`;

        ctx.fillRect(
            x,
            y,
            1.5,
            1.5
        );
    }

    /* مدينة مدمرة */

    drawRuins();

    /* الأرض */

    const ground=H*.78;

    const floor=
        ctx.createLinearGradient(
            0,ground,
            0,H
        );

    floor.addColorStop(
        0,
        "#151020"
    );

    floor.addColorStop(
        1,
        "#030305"
    );

    ctx.fillStyle=floor;

    ctx.fillRect(
        0,
        ground,
        W,
        H-ground
    );

    ctx.strokeStyle=
        "rgba(255,255,255,.12)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        0,
        ground
    );

    ctx.lineTo(
        W,
        ground
    );

    ctx.stroke();
}

/* -----------------------------
   المباني
----------------------------- */

function drawRuins(){

    const base=H*.78;

    for(let i=0;i<18;i++){

        const x=i*W/17;

        const height=
            50+
            ((i*37)%130);

        const width=
            30+
            ((i*13)%45);

        ctx.fillStyle=
            i%2===0?
            "#080812":
            "#0b0915";

        ctx.fillRect(
            x,
            base-height,
            width,
            height
        );

        /* النوافذ */

        for(
            let y=base-height+15;
            y<base-10;
            y+=20
        ){

            if(
                (i+y)%3===0
            ){

                ctx.fillStyle=
                    "rgba(120,100,255,.25)";

                ctx.fillRect(
                    x+8,
                    y,
                    5,
                    8
                );
            }
        }
    }
}

/* =========================================================
   هالة الشخصية
========================================================= */

function aura(char){

    const radius=
        70+
        Math.sin(frame*.12)*10;

    const g=
        ctx.createRadialGradient(
            char.x,
            char.y-60,
            5,
            char.x,
            char.y-60,
            radius
        );

    g.addColorStop(
        0,
        char.aura+"cc"
    );

    g.addColorStop(
        .35,
        char.aura+"55"
    );

    g.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
        char.x,
        char.y-60,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();
}

/* =========================================================
   رسم أيومي
========================================================= */

function drawAyumi(){

    ctx.save();

    ctx.translate(
        ayumi.x,
        ayumi.y
    );

    ctx.scale(
        ayumi.scale,
        ayumi.scale
    );

    ctx.rotate(
        ayumi.angle
    );

    aura({
        ...ayumi,
        x:0,
        y:0
    });

    /* الشعر */

    ctx.fillStyle=
        ayumi.hair;

    ctx.shadowColor=
        "#00e5ff";

    ctx.shadowBlur=15;

    ctx.beginPath();

    ctx.moveTo(
        -18,-80
    );

    ctx.quadraticCurveTo(
        -45,-75,
        -55,-40
    );

    ctx.lineTo(
        -35,-50
    );

    ctx.lineTo(
        -48,-10
    );

    ctx.lineTo(
        -20,-35
    );

    ctx.lineTo(
        0,-20
    );

    ctx.lineTo(
        25,-45
    );

    ctx.lineTo(
        18,-80
    );

    ctx.closePath();

    ctx.fill();

    /* الرأس */

    ctx.shadowBlur=10;

    ctx.fillStyle="#f2f2f2";

    ctx.beginPath();

    ctx.arc(
        0,
        -70,
        17,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* العين */

    ctx.fillStyle=
        "#00e5ff";

    ctx.shadowColor=
        "#00e5ff";

    ctx.shadowBlur=15;

    ctx.beginPath();

    ctx.arc(
        6,
        -72,
        3.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* الجسم */

    ctx.strokeStyle="#fff";

    ctx.lineWidth=6;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        0,-52
    );

    ctx.lineTo(
        0,-18
    );

    ctx.stroke();

    /* الأرجل */

    ctx.beginPath();

    ctx.moveTo(
        0,-18
    );

    ctx.lineTo(
        -17,10
    );

    ctx.moveTo(
        0,-18
    );

    ctx.lineTo(
        18,8
    );

    ctx.stroke();

    /* الذراع */

    ctx.beginPath();

    if(ayumi.attacking){

        ctx.moveTo(
            0,-43
        );

        ctx.lineTo(
            45,-65
        );

    }else{

        ctx.moveTo(
            0,-43
        );

        ctx.lineTo(
            20,-20
        );
    }

    ctx.stroke();

    /* السيف */

    if(ayumi.attacking){

        ctx.strokeStyle=
            ayumi.light;

        ctx.lineWidth=8;

        ctx.shadowColor=
            ayumi.light;

        ctx.shadowBlur=25;

        ctx.beginPath();

        ctx.moveTo(
            40,-65
        );

        ctx.lineTo(
            115,-90
        );

        ctx.stroke();

        /* نصل ثانوي */

        ctx.strokeStyle="#fff";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(
            43,-67
        );

        ctx.lineTo(
            115,-91
        );

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   رسم قائد الشياطين
========================================================= */

function drawDemon(){

    ctx.save();

    ctx.translate(
        demon.x,
        demon.y
    );

    ctx.scale(
        demon.scale,
        demon.scale
    );

    ctx.rotate(
        demon.angle
    );

    aura({
        ...demon,
        x:0,
        y:0
    });

    /* عباءة */

    ctx.fillStyle=
        "#12000a";

    ctx.shadowColor=
        "#ff0055";

    ctx.shadowBlur=20;

    ctx.beginPath();

    ctx.moveTo(
        -15,-50
    );

    ctx.lineTo(
        -50,5
    );

    ctx.lineTo(
        0,-10
    );

    ctx.lineTo(
        50,5
    );

    ctx.lineTo(
        15,-50
    );

    ctx.closePath();

    ctx.fill();

    /* شعر */

    ctx.fillStyle=
        demon.hair;

    ctx.beginPath();

    ctx.moveTo(
        -18,-82
    );

    ctx.lineTo(
        -45,-65
    );

    ctx.lineTo(
        -30,-75
    );

    ctx.lineTo(
        -45,-90
    );

    ctx.lineTo(
        -20,-87
    );

    ctx.lineTo(
        0,-105
    );

    ctx.lineTo(
        20,-87
    );

    ctx.lineTo(
        45,-90
    );

    ctx.lineTo(
        30,-75
    );

    ctx.lineTo(
        45,-65
    );

    ctx.lineTo(
        18,-82
    );

    ctx.closePath();

    ctx.fill();

    /* الرأس */

    ctx.fillStyle=
        "#ddd";

    ctx.beginPath();

    ctx.arc(
        0,
        -70,
        17,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* القرون */

    ctx.strokeStyle=
        "#ff0055";

    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.moveTo(
        -10,-84
    );

    ctx.lineTo(
        -28,-112
    );

    ctx.moveTo(
        10,-84
    );

    ctx.lineTo(
        28,-112
    );

    ctx.stroke();

    /* العينان */

    ctx.fillStyle=
        "#ff0055";

    ctx.shadowColor=
        "#ff0055";

    ctx.shadowBlur=20;

    ctx.beginPath();

    ctx.arc(
        -7,-72,
        3.5,
        0,
        Math.PI*2
    );

    ctx.arc(
        7,-72,
        3.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* الجسم */

    ctx.strokeStyle="#fff";

    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.moveTo(
        0,-52
    );

    ctx.lineTo(
        0,-15
    );

    ctx.stroke();

    /* الأرجل */

    ctx.beginPath();

    ctx.moveTo(
        0,-15
    );

    ctx.lineTo(
        -22,10
    );

    ctx.moveTo(
        0,-15
    );

    ctx.lineTo(
        22,10
    );

    ctx.stroke();

    /* الذراع والسيف */

    ctx.beginPath();

    ctx.moveTo(
        0,-43
    );

    ctx.lineTo(
        -45,-65
    );

    ctx.stroke();

    if(demon.attacking){

        ctx.strokeStyle=
            demon.light;

        ctx.lineWidth=9;

        ctx.shadowColor=
            demon.light;

        ctx.shadowBlur=30;

        ctx.beginPath();

        ctx.moveTo(
            -40,-65
        );

        ctx.lineTo(
            -115,-90
        );

        ctx.stroke();

        ctx.strokeStyle="#fff";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(
            -43,-67
        );

        ctx.lineTo(
            -115,-91
        );

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   خطوط سرعة
========================================================= */

function speedLines(color,direction){

    ctx.save();

    ctx.strokeStyle=color;
    ctx.globalAlpha=.3;
    ctx.lineWidth=2;

    for(let i=0;i<18;i++){

        const y=
            Math.random()*H;

        const length=
            Math.random()*150+50;

        const start=
            direction>0?
            0:
            W;

        ctx.beginPath();

        ctx.moveTo(
            start,
            y
        );

        ctx.lineTo(
            start-direction*length,
            y
        );

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   صدمة الطاقة
========================================================= */

function energyClash(){

    const x=W*.5;
    const y=H*.62;

    const radius=
        35+
        Math.sin(frame*.5)*10;

    const g=
        ctx.createRadialGradient(
            x,y,5,
            x,y,radius
        );

    g.addColorStop(
        0,
        "#ffffff"
    );

    g.addColorStop(
        .2,
        "#ffe600"
    );

    g.addColorStop(
        .45,
        "#00e5ff"
    );

    g.addColorStop(
        .7,
        "#ff0055"
    );

    g.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
        x,y,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();
}

/* =========================================================
   الضوء النهائي
========================================================= */

function finalLight(){

    const x=W*.5;
    const y=H*.3;

    const radius=
        Math.min(W,H)*.55;

    const g=
        ctx.createRadialGradient(
            x,y,10,
            x,y,radius
        );

    g.addColorStop(
        0,
        "rgba(255,255,255,.95)"
    );

    g.addColorStop(
        .15,
        "rgba(255,230,0,.7)"
    );

    g.addColorStop(
        .45,
        "rgba(0,229,255,.25)"
    );

    g.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}

/* =========================================================
   سيناريو الفيلم
========================================================= */

function cinematic(){

    /*
       0 - 4    مقدمة
       4 - 8    ظهور أيومي
       8 - 12   ظهور الشيطان
       12 - 17  التقارب
       17 - 21  الاندفاع
       21 - 27  الاشتباك
       27 - 32  الانفجار
       32 - 38  الضربة النهائية
       38 - 44  النهاية
    */

    const seconds=
        (frame%2640)/60;

    /* الوضع الأساسي */

    ayumi.y=H*.78;
    demon.y=H*.78;

    ayumi.scale=
        Math.min(W,H)/700;

    demon.scale=
        Math.min(W,H)/700;

    /* ----------------
       المشهد 1
    ---------------- */

    if(seconds<4){

        ayumi.x=W*.28;
        demon.x=W*.72;

        ayumi.attacking=false;
        demon.attacking=false;

        if(seconds>.5){

            document.getElementById(
                "title"
            ).style.opacity=1;

            document.getElementById(
                "title"
            ).style.transform=
                "scale(1)";
        }
    }

    /* ----------------
       المشهد 2
    ---------------- */

    else if(seconds<8){

        document.getElementById(
            "title"
        ).style.opacity=.25;

        ayumi.x=
            W*.28+
            (seconds-4)*8;

        demon.x=W*.72;

        ayumi.attacking=false;
        demon.attacking=false;

        if(
            frame%3===0
        ){
            energyParticles(
                ayumi,
                ayumi.aura
            );
        }
    }

    /* ----------------
       المشهد 3
    ---------------- */

    else if(seconds<12){

        ayumi.x=W*.36;
        demon.x=W*.64;

        ayumi.attacking=false;
        demon.attacking=false;

        if(frame%3===0){

            energyParticles(
                demon,
                demon.aura
            );
        }
    }

    /* ----------------
       المشهد 4
    ---------------- */

    else if(seconds<17){

        ayumi.x=
            W*.36+
            (seconds-12)*20;

        demon.x=
            W*.64-
            (seconds-12)*20;

        ayumi.attacking=false;
        demon.attacking=false;

        speedLines(
            "#00e5ff",
            1
        );

        speedLines(
            "#ff0055",
            -1
        );
    }

    /* ----------------
       المشهد 5
    ---------------- */

    else if(seconds<21){

        ayumi.x=
            W*.46;

        demon.x=
            W*.54;

        ayumi.attacking=true;
        demon.attacking=true;

        energyClash();

        if(frame%2===0){

            explosion(
                W*.5,
                H*.64,
                "#00e5ff",
                "#ff0055",
                8,
                7
            );
        }
    }

    /* ----------------
       المشهد 6
    ---------------- */

    else if(seconds<27){

        ayumi.x=W*.45;
        demon.x=W*.55;

        ayumi.attacking=true;
        demon.attacking=true;

        energyClash();

        if(frame%4===0){

            explosion(
                W*.5,
                H*.63,
                "#ffe600",
                "#ff0055",
                18,
                10
            );
        }

        if(
            seconds>24
        ){

            ayumi.x+=
                Math.sin(frame*.4)*5;

            demon.x+=
                Math.sin(frame*.4)*5;
        }
    }

    /* ----------------
       المشهد 7
    ---------------- */

    else if(seconds<32){

        ayumi.attacking=false;
        demon.attacking=false;

        ayumi.x=
            W*.30-
            (seconds-27)*4;

        demon.x=
            W*.70+
            (seconds-27)*4;

        explosion(
            W*.5,
            H*.62,
            "#ffffff",
            "#ffe600",
            5,
            5
        );

        finalLight();

        if(seconds>29){

            document.getElementById(
                "subtitle"
            ).textContent=
                "لن ينتهي النور...";

            document.getElementById(
                "subtitle"
            ).style.opacity=1;
        }
    }

    /* ----------------
       المشهد 8
    ---------------- */

    else if(seconds<38){

        ayumi.x=W*.35;
        demon.x=W*.65;

        ayumi.attacking=true;
        demon.attacking=false;

        if(
            seconds>34
        ){

            ayumi.x+=
                (W*.5-ayumi.x)*.15;

            speedLines(
                "#ffe600",
                1
            );

            if(frame%3===0){

                explosion(
                    ayumi.x+80,
                    H*.65,
                    "#ffe600",
                    "#00e5ff",
                    12,
                    8
                );
            }
        }

        if(
            seconds>36
        ){

            finalLight();

            if(frame%5===0){

                explosion(
                    W*.5,
                    H*.55,
                    "#ffffff",
                    "#ffe600",
                    20,
                    12
                );
            }
        }
    }

    /* ----------------
       المشهد 9
    ---------------- */

    else if(seconds<44){

        ayumi.x=W*.5;
        demon.x=W*.75;

        ayumi.attacking=false;
        demon.attacking=false;

        ayumi.angle=
            Math.sin(frame*.03)*.02;

        demon.angle=
            Math.sin(frame*.02)*.01;

        document.getElementById(
            "subtitle"
        ).textContent=
            "إمبراطور الظلام والنور";

        document.getElementById(
            "subtitle"
        ).style.opacity=1;

        if(seconds>41){

            document.getElementById(
                "title"
            ).style.opacity=1;

            document.getElementById(
                "title"
            ).style.transform=
                "scale(1)";
        }
    }

    /* ----------------
       إعادة المشهد
    ---------------- */

    else{

        document.getElementById(
            "subtitle"
        ).style.opacity=0;

        document.getElementById(
            "title"
        ).style.opacity=0;

        document.getElementById(
            "title"
        ).style.transform=
            "scale(.8)";
    }
}

/* =========================================================
   رسم الجزيئات
========================================================= */

function drawParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        particles[i].update();
        particles[i].draw();

        if(
            particles[i].life<=0
        ){

            particles.splice(i,1);
        }
    }
}

/* =========================================================
   الكاميرا السينمائية
========================================================= */

function cameraShake(){

    const seconds=
        (frame%2640)/60;

    if(
        seconds>17 &&
        seconds<32
    ){

        const power=
            4+
            Math.sin(frame*.5)*3;

        ctx.translate(
            (Math.random()-.5)*power,
            (Math.random()-.5)*power
        );
    }

    if(
        seconds>36 &&
        seconds<38
    ){

        const power=8;

        ctx.translate(
            (Math.random()-.5)*power,
            (Math.random()-.5)*power
        );
    }
}

/* =========================================================
   الحلقة الرئيسية
========================================================= */

function animate(){

    frame++;

    time=frame/FPS;

    background();

    ctx.save();

    cameraShake();

    cinematic();

    drawAyumi();

    drawDemon();

    drawParticles();

    ctx.restore();

    requestAnimationFrame(
        animate
    );
}

animate();

/* =========================================================
   منع إيقاف الحركة عند تغيير التركيز
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{
        if(
            !document.hidden
        ){
            requestAnimationFrame(
                animate
            );
        }
    }
);
</script>
