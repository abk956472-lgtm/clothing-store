<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>إمبراطور الظلام والنور</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030308;
    font-family: Arial, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

.title {
    position: fixed;
    top: 15px;
    right: 20px;
    z-index: 5;
    color: white;
    text-align: right;
    pointer-events: none;
    text-shadow:
        0 0 8px #00e5ff,
        0 0 18px #ff0055;
}

.title h1 {
    font-size: clamp(18px, 4vw, 32px);
}

.title p {
    margin-top: 4px;
    color: #ddd;
    font-size: clamp(11px, 2vw, 15px);
}

.hud {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: min(700px, 75vw);
    z-index: 5;
    pointer-events: none;
}

.names {
    display: flex;
    justify-content: space-between;
    color: white;
    font-weight: bold;
    margin-bottom: 5px;
    font-size: 14px;
}

.healthBox {
    width: 100%;
    height: 18px;
    background: #15151c;
    border: 2px solid #555;
    border-radius: 20px;
    overflow: hidden;
}

.health {
    height: 100%;
    width: 100%;
    transition: width .15s linear;
}

#playerHealth {
    background: linear-gradient(90deg, #00bfff, #00ffff);
    box-shadow: 0 0 15px #00e5ff;
}

#enemyHealth {
    background: linear-gradient(90deg, #ff0055, #ff0033);
    box-shadow: 0 0 15px #ff0055;
}

.energyBox {
    margin-top: 6px;
    width: 100%;
    height: 7px;
    background: #111;
    border-radius: 10px;
    overflow: hidden;
}

.energy {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ffe600, #ff9d00);
    box-shadow: 0 0 10px #ffe600;
}

.centerText {
    position: fixed;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 6;
    color: white;
    font-size: clamp(30px, 8vw, 80px);
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    text-shadow:
        0 0 10px #fff,
        0 0 30px #00e5ff;
}

.controls {
    position: fixed;
    bottom: 20px;
    left: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.controlGroup {
    display: flex;
    gap: 10px;
    pointer-events: auto;
}

.btn {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35);
    background: rgba(15,15,25,.75);
    color: white;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 0 0 12px rgba(0,229,255,.25);
    backdrop-filter: blur(5px);
    user-select: none;
}

.btn:active {
    transform: scale(.9);
    background: rgba(255,255,255,.2);
}

.attack {
    border-color: #ff0055;
    box-shadow: 0 0 15px rgba(255,0,85,.5);
}

.special {
    border-color: #ffe600;
    box-shadow: 0 0 15px rgba(255,230,0,.5);
}

.defend {
    border-color: #00e5ff;
}

#gameOver {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0,0,0,.72);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    text-align: center;
}

#gameOver h2 {
    font-size: clamp(35px, 9vw, 80px);
    text-shadow: 0 0 25px #ff0055;
}

#gameOver p {
    margin: 15px 0;
    font-size: 18px;
}

#restart {
    padding: 13px 30px;
    border: 0;
    border-radius: 30px;
    color: white;
    background: linear-gradient(90deg,#00aaff,#ff0055);
    font-size: 17px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="title">
    <h1>إمبراطور الظلام والنور</h1>
    <p>أيومي أشيا ⚔️ قائد الشياطين</p>
</div>

<div class="hud">
    <div class="names">
        <span>أيومي — النور</span>
        <span>قائد الشياطين — الظلام</span>
    </div>

    <div class="healthBox">
        <div id="playerHealth" class="health"></div>
    </div>

    <div class="energyBox">
        <div id="energy" class="energy"></div>
    </div>

    <div style="margin-top:4px" class="healthBox">
        <div id="enemyHealth" class="health"></div>
    </div>
</div>

<div id="centerText"></div>

<canvas id="stage"></canvas>

<div class="controls">
    <div class="controlGroup">
        <button class="btn" data-key="left">←</button>
        <button class="btn" data-key="right">→</button>
    </div>

    <div class="controlGroup">
        <button class="btn defend" data-key="defend">🛡</button>
        <button class="btn attack" data-key="attack">⚔</button>
        <button class="btn special" data-key="special">✦</button>
    </div>
</div>

<div id="gameOver">
    <h2 id="result"></h2>
    <p id="resultText"></p>
    <button id="restart">إعادة المعركة</button>
</div>

<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let frame = 0;
let shake = 0;
let gameEnded = false;

const keys = {};

const player = {
    x: 0,
    y: 0,
    vx: 0,
    hp: 100,
    energy: 100,
    state: "idle",
    facing: 1,
    attackTimer: 0,
    cooldown: 0,
    specialTimer: 0,
    defend: false,
    aura: "#00e5ff",
    weapon: "#ffe600"
};

const enemy = {
    x: 0,
    y: 0,
    vx: 0,
    hp: 100,
    state: "idle",
    facing: -1,
    attackTimer: 0,
    cooldown: 0,
    aura: "#ff0055",
    weapon: "#a000ff"
};

const particles = [];
const slashes = [];
const texts = [];

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

    if (!player.x) {
        player.x = W * .28;
        enemy.x = W * .72;
    }

    player.y = H * .74;
    enemy.y = H * .74;
}

window.addEventListener("resize", resize);
resize();

/* ================= PARTICLES ================= */

class Particle {
    constructor(x,y,color) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 2;

        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.color = color;
        this.size = Math.random() * 5 + 2;
        this.life = Math.random() * 35 + 20;
        this.maxLife = this.life;
        this.gravity = .08;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= .98;
        this.life--;
        this.size *= .96;
    }

    draw() {
        ctx.save();

        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;

        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();

        ctx.restore();
    }
}

function explosion(x,y,color1,color2,count=35) {
    for(let i=0;i<count;i++) {
        particles.push(
            new Particle(
                x,
                y,
                Math.random() > .5 ? color1 : color2
            )
        );
    }

    shake = Math.max(shake,8);
}

function energyTrail(char,color) {
    for(let i=0;i<3;i++) {
        particles.push(new Particle(char.x, char.y-35, color));
    }
}

/* ================= TEXT EFFECT ================= */

function floatingText(x,y,text,color) {
    texts.push({
        x,y,text,color,
        life:50,
        vy:-1
    });
}

/* ================= SLASH ================= */

function createSlash(x,y,color,direction) {
    slashes.push({
        x,
        y,
        color,
        direction,
        life:15,
        maxLife:15
    });
}

function drawSlashes() {
    for(let i=slashes.length-1;i>=0;i--) {
        const s = slashes[i];

        s.life--;

        ctx.save();

        ctx.globalAlpha = s.life/s.maxLife;
        ctx.strokeStyle = s.color;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 20;
        ctx.lineWidth = 8;
        ctx.lineCap = "round";

        ctx.beginPath();

        if(s.direction === 1) {
            ctx.moveTo(s.x-60,s.y+25);
            ctx.quadraticCurveTo(
                s.x,
                s.y-45,
                s.x+65,
                s.y-10
            );
        } else {
            ctx.moveTo(s.x+60,s.y+25);
            ctx.quadraticCurveTo(
                s.x,
                s.y-45,
                s.x-65,
                s.y-10
            );
        }

        ctx.stroke();
        ctx.restore();

        if(s.life<=0) slashes.splice(i,1);
    }
}

/* ================= CHARACTER DRAWING ================= */

function drawCharacter(char,isDemon=false) {

    ctx.save();

    ctx.translate(char.x,char.y);

    const pulse = Math.sin(frame*.12)*5;

    /* aura */

    const gradient = ctx.createRadialGradient(
        0,-50,5,
        0,-50,100+pulse
    );

    gradient.addColorStop(0,char.aura);
    gradient.addColorStop(.35,char.aura+"88");
    gradient.addColorStop(1,"transparent");

    ctx.fillStyle = gradient;

    ctx.beginPath();
    ctx.arc(0,-50,100+pulse,0,Math.PI*2);
    ctx.fill();

    /* shadow */

    ctx.fillStyle = "rgba(0,0,0,.5)";
    ctx.beginPath();
    ctx.ellipse(0,12,42,10,0,0,Math.PI*2);
    ctx.fill();

    /* body */

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.shadowColor = char.aura;
    ctx.shadowBlur = 15;

    /* head */

    ctx.fillStyle = "#f4f4f4";

    ctx.beginPath();
    ctx.arc(0,-78,17,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    /* eyes */

    ctx.fillStyle = isDemon ? "#ff0055" : "#00e5ff";

    ctx.beginPath();
    ctx.arc(-6,-80,3,0,Math.PI*2);
    ctx.arc(6,-80,3,0,Math.PI*2);
    ctx.fill();

    /* horns */

    if(isDemon) {

        ctx.strokeStyle = "#ff0055";
        ctx.lineWidth = 6;

        ctx.beginPath();

        ctx.moveTo(-9,-91);
        ctx.lineTo(-22,-113);

        ctx.moveTo(9,-91);
        ctx.lineTo(22,-113);

        ctx.stroke();

        ctx.strokeStyle = "#fff";
    }

    /* torso */

    ctx.beginPath();

    ctx.moveTo(0,-61);
    ctx.lineTo(0,-22);

    ctx.stroke();

    const cycle = Math.sin(frame*.18);

    /* animation */

    if(char.state === "attack") {

        ctx.beginPath();

        ctx.moveTo(0,-22);
        ctx.lineTo(-17,10);

        ctx.moveTo(0,-22);
        ctx.lineTo(18,8);

        ctx.moveTo(0,-48);
        ctx.lineTo(char.facing*35,-57);

        ctx.stroke();

        /* sword */

        ctx.strokeStyle = char.weapon;
        ctx.lineWidth = 8;
        ctx.shadowColor = char.weapon;
        ctx.shadowBlur = 25;

        ctx.beginPath();

        ctx.moveTo(char.facing*35,-57);
        ctx.lineTo(char.facing*95,-78);

        ctx.stroke();

        ctx.strokeStyle = "#fff";

    } else if(char.state === "special") {

        ctx.beginPath();

        ctx.moveTo(0,-22);
        ctx.lineTo(-25,8);

        ctx.moveTo(0,-22);
        ctx.lineTo(25,8);

        ctx.moveTo(0,-48);
        ctx.lineTo(char.facing*55,-70);

        ctx.stroke();

        ctx.strokeStyle = char.weapon;
        ctx.lineWidth = 11;
        ctx.shadowBlur = 35;

        ctx.beginPath();

        ctx.moveTo(char.facing*45,-70);
        ctx.lineTo(char.facing*130,-100);

        ctx.stroke();

        ctx.strokeStyle = "#fff";

    } else if(char.state === "defend") {

        ctx.strokeStyle = char.aura;

        ctx.lineWidth = 8;

        ctx.beginPath();

        ctx.arc(0,-48,45,0,Math.PI*2);

        ctx.stroke();

        ctx.strokeStyle = "#fff";

        ctx.beginPath();

        ctx.moveTo(0,-22);
        ctx.lineTo(-18,10);

        ctx.moveTo(0,-22);
        ctx.lineTo(18,10);

        ctx.moveTo(0,-48);
        ctx.lineTo(char.facing*20,-25);

        ctx.stroke();

    } else {

        ctx.beginPath();

        ctx.moveTo(0,-22);
        ctx.lineTo(-10+cycle*5,10);

        ctx.moveTo(0,-22);
        ctx.lineTo(10-cycle*5,10);

        ctx.moveTo(0,-48);
        ctx.lineTo(-18,-25);

        ctx.moveTo(0,-48);
        ctx.lineTo(18,-25);

        ctx.stroke();
    }

    ctx.restore();
}

/* ================= BACKGROUND ================= */

function drawBackground() {

    const bg = ctx.createLinearGradient(0,0,0,H);

    bg.addColorStop(0,"#010107");
    bg.addColorStop(.5,"#080718");
    bg.addColorStop(1,"#12030d");

    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    /* moon */

    ctx.save();

    ctx.globalAlpha=.15;
    ctx.fillStyle="#ffffff";
    ctx.shadowColor="#ffffff";
    ctx.shadowBlur=40;

    ctx.beginPath();
    ctx.arc(W*.5,H*.25,70,0,Math.PI*2);
    ctx.fill();

    ctx.restore();

    /* stars */

    for(let i=0;i<70;i++) {

        const x=(i*137)%W;
        const y=(i*71)%(H*.65);

        ctx.fillStyle=`rgba(255,255,255,${.15+Math.sin(frame*.02+i)*.1})`;

        ctx.fillRect(x,y,2,2);
    }

    /* ground */

    const ground=H*.74;

    ctx.strokeStyle="rgba(255,255,255,.18)";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(0,ground+15);
    ctx.lineTo(W,ground+15);
    ctx.stroke();

    /* energy crack */

    ctx.strokeStyle="rgba(0,229,255,.15)";

    ctx.beginPath();

    ctx.moveTo(W*.1,ground+15);
    ctx.lineTo(W*.25,ground+20);
    ctx.lineTo(W*.35,ground+12);

    ctx.moveTo(W*.65,ground+12);
    ctx.lineTo(W*.75,ground+20);
    ctx.lineTo(W*.9,ground+15);

    ctx.stroke();
}

/* ================= INPUT ================= */

function setKey(key,value) {
    keys[key]=value;
}

window.addEventListener("keydown",e => {

    if(e.repeat) return;

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
        setKey("left",true);

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
        setKey("right",true);

    if(e.key===" " || e.key.toLowerCase()==="j")
        setKey("attack",true);

    if(e.key.toLowerCase()==="k")
        setKey("special",true);

    if(e.key.toLowerCase()==="l")
        setKey("defend",true);
});

window.addEventListener("keyup",e => {

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
        setKey("left",false);

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
        setKey("right",false);

    if(e.key===" " || e.key.toLowerCase()==="j")
        setKey("attack",false);

    if(e.key.toLowerCase()==="k")
        setKey("special",false);

    if(e.key.toLowerCase()==="l")
        setKey("defend",false);
});

document.querySelectorAll(".btn").forEach(btn => {

    const key=btn.dataset.key;

    btn.addEventListener("pointerdown",e => {
        e.preventDefault();
        setKey(key,true);
    });

    btn.addEventListener("pointerup",e => {
        e.preventDefault();
        setKey(key,false);
    });

    btn.addEventListener("pointercancel",()=>{
        setKey(key,false);
    });

    btn.addEventListener("pointerleave",()=>{
        setKey(key,false);
    });
});

/* ================= COMBAT ================= */

function playerAttack() {

    if(player.cooldown>0) return;

    player.state="attack";
    player.attackTimer=14;
    player.cooldown=22;

    createSlash(
        player.x + player.facing*55,
        player.y-55,
        player.weapon,
        player.facing
    );

    const distance=Math.abs(player.x-enemy.x);

    if(distance<150) {

        let damage=8;

        if(enemy.state==="defend")
            damage=2;

        enemy.hp=Math.max(0,enemy.hp-damage);

        explosion(
            enemy.x,
            enemy.y-50,
            player.aura,
            player.weapon,
            15
        );

        floatingText(
            enemy.x,
            enemy.y-100,
            "-"+damage,
            "#ffe600"
        );
    }
}

function playerSpecial() {

    if(player.energy<35 || player.specialTimer>0)
        return;

    player.energy-=35;
    player.state="special";
    player.specialTimer=55;
    shake=15;

    createSlash(
        player.x + player.facing*100,
        player.y-70,
        "#ffe600",
        player.facing
    );

    explosion(
        enemy.x,
        enemy.y-50,
        "#ffe600",
        "#00e5ff",
        60
    );

    const distance=Math.abs(player.x-enemy.x);

    if(distance<300) {

        const damage=22;

        enemy.hp=Math.max(0,enemy.hp-damage);

        floatingText(
            enemy.x,
            enemy.y-110,
            "-"+damage,
            "#ffe600"
        );
    }
}

function enemyAI() {

    if(enemy.cooldown>0) return;

    const distance=Math.abs(enemy.x-player.x);

    if(distance>170) {

        enemy.state="dash";

        const direction=player.x>enemy.x ? 1 : -1;

        enemy.x+=direction*2.8;
        enemy.facing=direction;

        energyTrail(enemy,enemy.aura);

    } else {

        if(Math.random()<.025) {

            enemy.state="attack";
            enemy.attackTimer=15;
            enemy.cooldown=35;

            createSlash(
                enemy.x+enemy.facing*50,
                enemy.y-55,
                enemy.weapon,
                enemy.facing
            );

            let damage=7;

            if(player.defend)
                damage=1;

            player.hp=Math.max(0,player.hp-damage);

            explosion(
                player.x,
                player.y-50,
                enemy.aura,
                enemy.weapon,
                15
            );

            floatingText(
                player.x,
                player.y-105,
                "-"+damage,
                "#ff0055"
            );

        } else {

            enemy.state="idle";
        }
    }
}

/* ================= PLAYER ================= */

function updatePlayer() {

    player.defend=keys.defend;

    if(player.specialTimer>0)
        player.specialTimer--;

    if(player.cooldown>0)
        player.cooldown--;

    if(player.attackTimer>0) {
        player.attackTimer--;
        return;
    }

    player.state=player.defend ? "defend" : "idle";

    if(keys.left) {

        player.x-=4;
        player.facing=-1;
        energyTrail(player,player.aura);
    }

    if(keys.right) {

        player.x+=4;
        player.facing=1;
        energyTrail(player,player.aura);
    }

    if(keys.attack)
        playerAttack();

    if(keys.special)
        playerSpecial();

    player.x=Math.max(60,Math.min(W-60,player.x));

    player.energy=Math.min(
        100,
        player.energy+.12
    );
}

/* ================= EFFECT TEXT ================= */

function updateTexts() {

    for(let i=texts.length-1;i>=0;i--) {

        const t=texts[i];

        t.y+=t.vy;
        t.life--;

        ctx.save();

        ctx.globalAlpha=t.life/50;
        ctx.fillStyle=t.color;
        ctx.font="bold 22px Arial";
        ctx.textAlign="center";

        ctx.shadowColor=t.color;
        ctx.shadowBlur=12;

        ctx.fillText(t.text,t.x,t.y);

        ctx.restore();

        if(t.life<=0)
            texts.splice(i,1);
    }
}

/* ================= HUD ================= */

function updateHUD() {

    document.getElementById("playerHealth").style.width =
        player.hp+"%";

    document.getElementById("enemyHealth").style.width =
        enemy.hp+"%";

    document.getElementById("energy").style.width =
        player.energy+"%";
}

/* ================= GAME OVER ================= */

function endGame() {

    if(gameEnded) return;

    gameEnded=true;

    const screen=document.getElementById("gameOver");
    const result=document.getElementById("result");
    const text=document.getElementById("resultText");

    screen.style.display="flex";

    if(player.hp<=0) {

        result.textContent="انتصار الظلام";
        result.style.textShadow="0 0 30px #ff0055";
        text.textContent="قائد الشياطين حسم المعركة.";
    } else {

        result.textContent="انتصار النور";
        result.style.textShadow="0 0 30px #00e5ff";
        text.textContent="أيومي أشيا أطلق الضربة الأخيرة.";
    }
}

function resetGame() {

    player.x=W*.28;
    enemy.x=W*.72;

    player.hp=100;
    enemy.hp=100;

    player.energy=100;

    player.cooldown=0;
    player.specialTimer=0;
    enemy.cooldown=0;

    player.state="idle";
    enemy.state="idle";

    particles.length=0;
    slashes.length=0;
    texts.length=0;

    gameEnded=false;

    document.getElementById("gameOver").style.display="none";
}

document.getElementById("restart")
    .addEventListener("click",resetGame);

/* ================= MAIN LOOP ================= */

function animate() {

    frame++;

    if(!gameEnded) {

        updatePlayer();
        enemyAI();

        if(enemy.attackTimer>0)
            enemy.attackTimer--;
        else if(enemy.state==="attack")
            enemy.state="idle";

        if(player.hp<=0 || enemy.hp<=0)
            endGame();
    }

    player.y=H*.74;
    enemy.y=H*.74;

    ctx.save();

    if(shake>0) {

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );

        shake*=.88;

        if(shake<.2)
            shake=0;
    }

    drawBackground();

    drawCharacter(player,false);
    drawCharacter(enemy,true);

    drawSlashes();

    for(let i=particles.length-1;i>=0;i--) {

        particles[i].update();
        particles[i].draw();

        if(particles[i].life<=0)
            particles.splice(i,1);
    }

    updateTexts();

    ctx.restore();

    updateHUD();

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
